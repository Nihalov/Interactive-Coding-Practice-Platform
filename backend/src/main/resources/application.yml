spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/codearena
    username: ${DB_USERNAME:codearena}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080