app:
  jwt:
    secret: ${JWT_SECRET}  #dev-only-secret-change-me-please-32bytes-min!!
    expiration-minutes: 60
  runner:
    mode: docker
    docker-binary: docker
    image: eclipse-temurin:21-jdk
    memory: 512m
    cpus: "1"
    pids-limit: 64
    time-limit-ms: 4000
    compile-timeout-ms: 20000
    max-output-bytes: 1048576
  recovery:
    interval-ms: 60000
    queued-after-minutes: 2
    running-after-minutes: 5
  rate-limit:
    submissions-per-minute: 10
    runs-per-minute: 20
    logins-per-minute: 10
    registrations-per-hour: 10
    max-active-submissions: 3
  cache:
    problem-ttl-minutes: 10
    list-ttl-minutes: 5

spring:
  config:
    # Lets a local copy of the repository root's .env file supply the values below.
    # Environment variables still take precedence, so this is safe for deployments.
    import: optional:file:../.env[.properties]

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 500ms
      connect-timeout: 500ms

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/codearena}
    username: ${DB_USERNAME:codearena}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
