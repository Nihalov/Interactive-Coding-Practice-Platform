app:
  jwt:
    secret: ${JWT_SECRET}  #dev-only-secret-change-me-please-32bytes-min!!
    expiration-minutes: 60
  runner:
    mode: docker
    docker-binary: docker
    image: eclipse-temurin:21-jdk
    memory: 512m
    cpus: "1"
    pids-limit: 64
    time-limit-ms: 4000
    compile-timeout-ms: 20000
    max-output-bytes: 1048576
  recovery:
    interval-ms: 60000
    queued-after-minutes: 2
    running-after-minutes: 5

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

  datasource:
    url: jdbc:postgresql://localhost:5433/codearena
    username: ${DB_USERNAME:codearena}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080