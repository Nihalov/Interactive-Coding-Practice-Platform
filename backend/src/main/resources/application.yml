app:
  jwt:
    secret: ${JWT_SECRET}  #dev-only-secret-change-me-please-32bytes-min!!
    expiration-minutes: 60
  runner:
    time-limit-ms: 3000
    compile-timeout-ms: 15000
    max-output-bytes: 1048576

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

  datasource:
    url: jdbc:postgresql://localhost:5433/codearena
    username: ${DB_USERNAME:codearena}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080